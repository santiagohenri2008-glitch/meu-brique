
name: Gerar APK Meu Brique

on:
  push:
    paths:
      - 'MeuBrique-Android-Projeto.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip MeuBrique-Android-Projeto.zip
          mv MeuBrique-Android-Projeto.zip /tmp/projeto.zip 2>/dev/null || true

      - name: Compilar APK
        run: gradle -p MeuBrique assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuBrique-APK
          path: MeuBrique/app/build/outputs/apk/debug/app-debug.apk
